apiVersion: apps/v1
kind: Deployment
metadata:
  name: distro-crash-demo-10s
  namespace: distro-crash-demo
  labels:
    app: distro-crash-demo-10s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: distro-crash-demo-10s
  template:
    metadata:
      labels:
        app: distro-crash-demo-10s
    spec:
      containers:
        - name: api
          image: ghcr.io/odigos-io/simple-demo/odigos-demo-distro-crash:v1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: CRASH_DELAY_SECONDS
              value: "10"
          ports:
            - containerPort: 3000
          startupProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: distro-crash-demo-10s
  namespace: distro-crash-demo
spec:
  selector:
    app: distro-crash-demo-10s
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
---
apiVersion: odigos.io/v1alpha1
kind: Source
metadata:
  name: distro-crash-demo-10s
  namespace: distro-crash-demo
spec:
  workload:
    name: distro-crash-demo-10s
    namespace: distro-crash-demo
    kind: Deployment
